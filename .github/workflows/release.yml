name: Release

on:
  push:
    branches: [main]
  # Manual trigger for re-running the MCP-registry publish on its own - the
  # npm/GHCR steps stay guarded by the version-tag check, so this is safe.
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.check.outputs.released }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - id: check
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "Tag v${{ steps.version.outputs.version }} already exists - nothing to release."
          else
            echo "released=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.released == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          registry-url: https://registry.npmjs.org

      - if: steps.check.outputs.released == 'true'
        run: npm ci

      - if: steps.check.outputs.released == 'true'
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build

      # Trusted Publisher (OIDC) handles npm auth - no token. Needs a recent
      # npm CLI for OIDC support; the runner's bundled npm can be too old.
      - if: steps.check.outputs.released == 'true'
        run: npm install --global npm@latest

      - if: steps.check.outputs.released == 'true'
        name: Publish to npm
        run: npm publish --provenance --access public

      - if: steps.check.outputs.released == 'true'
        name: Tag and create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git tag "v$VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" --title "v$VERSION" --notes "See CHANGELOG.md for release notes."

  docker:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/whisper-sec/whisper-graph-mcp:latest
            ghcr.io/whisper-sec/whisper-graph-mcp:${{ needs.release.outputs.version }}

  publish-mcp:
    needs: release
    # Runs on a fresh release, or on a manual dispatch (to re-publish server.json
    # against the current main without cutting a new version).
    if: needs.release.outputs.released == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Best-effort: a registry hiccup must not fail the release.
    continue-on-error: true
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar -xz mcp-publisher
      - name: Publish to the MCP registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
