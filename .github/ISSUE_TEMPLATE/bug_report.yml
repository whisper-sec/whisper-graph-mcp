name: Bug report
description: Report a problem with the WhisperGraph MCP server
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: How can we reproduce it? Include the MCP client, transport (stdio/http), and the tool or query involved.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: whisper-graph-mcp version (and Node.js version).
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant stderr output. Redact your API key.
      render: shell
