displayName: WhisperGraph
description: >-
  WhisperGraph maps the entire internet into a single Cypher-queryable graph:
  every domain, IP, ASN, prefix, organization, and threat-intel listing
  connected as nodes and edges (46B+ total, real-time). Built for AI agents
  from day one — sign up programmatically with two HTTP calls, no browser,
  no CAPTCHA, no waiting list. Anonymous queries also available with no
  signup (2-hop traversal limit). Free trial for everyone; paid tiers for
  higher quotas. Works with Claude, Cursor, ChatGPT, VS Code, LangChain,
  and any MCP-compatible agent.
homepage: https://www.whisper.security/docs/ai/mcp/setup
tags:
  - mcp
  - cybersecurity
  - threat-intelligence
  - infrastructure
  - dns
  - network
  - graph
  - internet
  - ip
  - asn
  - bgp
  - whois
  - security
  - investigation
  - forensics
  - attack-surface
  - brand-protection
startCommand:
  type: stdio
  configSchema:
    type: object
    required: []
    properties:
      whisperApiKey:
        type: string
        title: WhisperGraph API Key
        description: >-
          Get an API key programmatically in 2 HTTP calls (see
          https://www.whisper.security/docs/agent-signup) or via the dashboard
          at https://console.whisper.security/sign-up.
  commandFunction: |-
    (config) => ({
      command: "node",
      args: ["dist/index.js"],
      env: config.whisperApiKey ? { WHISPER_API_KEY: config.whisperApiKey } : {}
    })
